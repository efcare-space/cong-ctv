<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outline App CTV PWA</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g2:#C0A866;--g3:#A78B59;--nen:#F6F7F4;--the:#fff;--chu:#14243A;--mo:#5B6B80;--vien:#E3E6DF;--tx:#1F6F63;--txn:#E4F1EE;--xn:#8A5A00;--xnn:#FFF3D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nen:#0B1622;--the:#13212F;--chu:#E8EDF3;--mo:#9AA9BA;--vien:#26384B;--tx:#7FD1C1;--txn:#12352F;--xn:#E3B566;--xnn:#3A2C12}}
:root[data-theme="dark"]{--nen:#0B1622;--the:#13212F;--chu:#E8EDF3;--mo:#9AA9BA;--vien:#26384B;--tx:#7FD1C1;--txn:#12352F;--xn:#E3B566;--xnn:#3A2C12}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--nen);color:var(--chu);line-height:1.6;font-size:15px}
header{background:linear-gradient(135deg,#14302B,#1F6F63);color:#F4F6FA;padding:26px 16px 20px}
header .w,main{max-width:1180px;margin:0 auto}
header .nhan{color:#E8C98A;font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase}
header h1{font-size:clamp(22px,3.6vw,32px);margin:6px 0}
header p{opacity:.9;max-width:820px;font-size:14.5px}
.thanh{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.thanh label{font-size:14px;display:flex;gap:6px;align-items:center;cursor:pointer;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px}
.thanh .so{font-size:13px;background:#E8C98A;color:#14302B;font-weight:700;padding:4px 10px;border-radius:999px}
main{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px 16px 60px}
@media(max-width:820px){main{grid-template-columns:1fr}aside{position:static!important;max-height:none!important}}
aside{position:sticky;top:12px;align-self:start;background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:10px;max-height:calc(100vh - 24px);overflow:auto}
aside button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:14px;color:var(--chu);padding:8px 10px;border-radius:8px;cursor:pointer}
aside button.on{background:var(--txn);color:var(--tx);font-weight:700}
aside button small{font-size:11px;font-weight:700;background:var(--xnn);color:var(--xn);border-radius:999px;padding:1px 7px;align-self:center}
.trang{background:var(--the);border:1px solid var(--vien);border-radius:16px;overflow:hidden}
.trinh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--vien);background:var(--nen);font-size:13px;color:var(--mo)}
.trinh i{width:10px;height:10px;border-radius:50%;background:#E3B566;display:inline-block}
.trinh i+i{background:#9CC3B8}.trinh i+i+i{background:#E6A08C}
.nd{padding:26px clamp(16px,4vw,40px) 34px}
.nd h2{font-size:clamp(22px,3vw,28px);color:var(--tx);margin-bottom:14px;line-height:1.25}
.nd h3{font-size:18px;margin:22px 0 8px}
.nd p{margin:8px 0}
.nd ul,.nd ol{padding-left:22px;margin:8px 0}
.nd li{margin:5px 0}.nd li.con{margin-left:18px;list-style:circle}
.nd b{color:var(--chu)}
.cuon{overflow-x:auto;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--vien);vertical-align:top}
th{background:var(--txn);color:var(--tx);font-size:13px}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--nen);padding:1px 5px;border-radius:5px}
.xn{display:inline;background:var(--xnn);color:var(--xn);font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;line-height:1.9}
.anh{display:inline-block;border:1.5px dashed var(--g2);color:var(--g3);font-size:13px;padding:6px 10px;border-radius:8px;margin:4px 0}
.nut{display:inline-block;background:#1F6F63;color:#fff;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;margin:4px 6px 4px 0}
.form{display:block;border:1px solid var(--vien);background:var(--nen);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
body.sach .xn,body.sach .anh{display:none}
.dk{display:flex;justify-content:space-between;padding:0 clamp(16px,4vw,40px) 22px}
.dk button{font:inherit;font-weight:700;border:1px solid var(--vien);background:var(--the);color:var(--chu);border-radius:10px;padding:8px 14px;cursor:pointer}
</style></head>

var S=[{"id": "s0", "so": "0", "ten": "Mục tiêu và phạm vi", "ngan": "Mục tiêu và phạm vi", "html": "<ul><li>Xây <b>App CTV dạng PWA</b> (Progressive Web App: web cài lên màn hình điện thoại như app, không qua kho ứng dụng) thay cho Cổng CTV tạm (Google Sheets + Apps Script).</li><li>Thuộc <b>Luồng 2 – Thương mại</b> (họp 20/10): CTV, khách, đơn, hoa hồng, chi trả. <b>Không lưu chỉ số sức khỏe</b>; Luồng 1 (đo, bác sĩ) là App FaCare hiện có.</li><li><b>Luật nghiệp vụ nằm ở đặc tả</b> (link trên). Outline này chỉ nói <i>xây cái gì, nối với đâu, làm theo thứ tự nào</i>.</li><li>Ba phần: <b>(A) App CTV</b> cho cộng tác viên · <b>(B) Trang khách</b> công khai · <b>(C) Back-office</b> cho nội bộ.</li></ul>", "xn": 0}, {"id": "s1", "so": "1", "ten": "Người dùng và nơi họ dùng", "ngan": "Người dùng và nơi họ dùng", "html": "<div class=\"cuon\"><table><tr><th>Người dùng</th><th>Dùng ở đâu</th><th>Việc chính</th></tr><tr><td>CTV, Quản lý L1–L5</td><td>(A) App CTV, điện thoại</td><td>Học, lên đơn, chia sẻ link, chăm sóc khách, xem thu nhập, nhóm</td></tr><tr><td>Khách hàng</td><td>(B) Trang khách, không cần cài</td><td>Xem sản phẩm, đặt mua qua link CTV, thanh toán, tra cứu đơn, đánh giá, quản lý đồng ý dữ liệu</td></tr><tr><td>Admin, Kế toán, Kho, Học viện, GĐ Kinh doanh</td><td>(C) Back-office, máy tính</td><td>Xác nhận thu tiền, giao hàng, mở bán CTV, duyệt giới thiệu, cấu hình chính sách, chốt kỳ, chi trả</td></tr></table></div>", "xn": 0}, {"id": "s2", "so": "2", "ten": "(A) App CTV — các màn hình", "ngan": "(A) App CTV", "html": "<div class=\"cuon\"><table><tr><th>#</th><th>Màn hình</th><th>Nội dung</th><th>Có ở Cổng CTV hiện nay</th></tr><tr><td>A1</td><td>Đăng nhập</td><td>Mã CTV hoặc SĐT + PIN; quên PIN qua mã gửi email/Zalo; ghi nhớ thiết bị</td><td>Có (PIN, quên PIN qua email)</td></tr><tr><td>A2</td><td>Đăng ký CTV</td><td>Họ tên, SĐT, email, tỉnh, mã người giới thiệu, đồng ý điều khoản → trạng thái <b>Đang học</b></td><td>Có</td></tr><tr><td>A3</td><td>Việc cần làm (trang chủ)</td><td>Gọi xác nhận đơn mới, hướng dẫn khách sau giao 4 ngày, mời đánh giá, nhắc que thử, kèm người mới, lịch đo 2 lần/tháng cho khách gói</td><td>Có một phần</td></tr><tr><td>A4</td><td>Học</td><td>Lộ trình 5 bước, tài liệu, bài kiểm tra; đạt → <b>Hoạt động</b> (mở bán)</td><td>Có lộ trình, chưa có bài kiểm tra</td></tr><tr><td>A5</td><td>Bán hàng</td><td>Danh mục, giá; lên đơn cho khách; link và QR có mã CTV theo đối tượng (gia đình, doanh nghiệp, trường học, tổ chức, đối tác)</td><td>Có</td></tr><tr><td>A6</td><td>Khách của tôi</td><td>Danh sách khách mình phụ trách, đơn, gói đang dùng, vai (bán / chăm sóc); ẩn SĐT khi chưa đồng ý liên hệ</td><td>Có một phần</td></tr><tr><td>A7</td><td>Giới thiệu (QĐ12)</td><td>Tạo phiếu giới thiệu Đối tác/tổ chức, hình thức a/b, trạng thái duyệt, báo cáo tháng (hình thức b)</td><td>Có phiếu, chưa có báo cáo tháng</td></tr><tr><td>A8</td><td>Thu nhập</td><td>Tạm tính theo kỳ, tách theo vai và căn cứ (QĐ09, QĐ10, QĐ12, QĐ13), thuế, thực nhận, lịch sử chi</td><td>Có QĐ09, QĐ12</td></tr><tr><td>A9</td><td>Nhóm</td><td>Người mình mời, đội theo đơn vị chủ quản, doanh thu đội, cấp L, còn bao nhiêu để lên cấp</td><td>Có (QĐ13)</td></tr><tr><td>A10</td><td>Hồ sơ</td><td>Thông tin, tài khoản nhận tiền, bản cam kết thuế, đổi PIN</td><td>Có một phần</td></tr></table></div>", "xn": 0}, {"id": "s3", "so": "3", "ten": "(B) Trang khách — công khai", "ngan": "(B) Trang khách", "html": "<ul><li>Trang theo đối tượng: gia đình, doanh nghiệp, trường học, tổ chức, đối tác (đang có ở <code>efcare-space.github.io/cong-ctv/</code>, chuyển sang tên miền chính thức).</li><li>Đặt mua (Vali, thuê, vật tư, Gói An tâm gia đình) → hiện <b>thông tin chuyển khoản có mã đơn</b> (đề xuất VietQR). Doanh nghiệp, trường học: chỉ <b>đăng ký tư vấn</b>, không thanh toán trên web.</li><li>Tra cứu đơn bằng mã đơn + SĐT; đánh giá CTV 1–5 sao sau giao; bật/tắt từng mục đồng ý dữ liệu.</li><li>Giữ mã CTV, nguồn (<code>ctv</code>, <code>utm_*</code>) từ link vào suốt phiên.</li></ul>", "xn": 0}, {"id": "s4", "so": "4", "ten": "(C) Back-office", "ngan": "(C) Back-office", "html": "<div class=\"cuon\"><table><tr><th>Khu</th><th>Người dùng</th><th>Chức năng</th></tr><tr><td>Đơn hàng</td><td>Kế toán, Kho</td><td>Xác nhận <b>Đã thu</b> (đối soát sao kê theo mã đơn), ghi <b>Đã giao</b> + serial, huỷ, trả lại</td></tr><tr><td>CTV</td><td>Học viện, Admin</td><td>Xếp lớp, ghi đạt bài kiểm tra → mở bán; tạm dừng; sửa đơn vị chủ quản; chuyển khách khi CTV nghỉ</td></tr><tr><td>Giới thiệu</td><td>GĐ Kinh doanh</td><td>Duyệt / từ chối phiếu QĐ12</td></tr><tr><td>Chính sách</td><td>Admin</td><td>Danh mục, giá, tỷ lệ, ngưỡng — <b>có ngày hiệu lực</b>, giữ lịch sử phiên bản</td></tr><tr><td>Kỳ hoa hồng</td><td>Kinh doanh, Kế toán</td><td>Lập bảng trước ngày 05, xác nhận trước ngày 10, khoá kỳ, xuất file chi; chốt QĐ13 (xem trước / chốt)</td></tr><tr><td>Báo cáo</td><td>Ban điều hành</td><td>Doanh số theo ngày thu, nguồn, CTV, đội; đơn quá 24 giờ; tỷ lệ hoa hồng/doanh thu; đánh giá</td></tr></table></div>", "xn": 0}, {"id": "s5", "so": "5", "ten": "Mô hình dữ liệu (thực thể chính)", "ngan": "Mô hình dữ liệu", "html": "<div class=\"cuon\"><table><tr><th>Thực thể</th><th>Ghi chú</th></tr><tr><td>Thành viên</td><td>Một người một mã (đề xuất <b>EFC-ID</b> dùng chung với EFCommunity), chống trùng SĐT; mã cũ CTV-xxxx, KH-xxxxxx giữ làm bí danh</td></tr><tr><td>Vai</td><td>Khách, CTV, Quản lý L1–L5, Nhân sự… — nhãn gắn vào thành viên, có từ ngày / đến ngày</td></tr><tr><td>Quan hệ</td><td>Người giới thiệu (1 cấp), đơn vị chủ quản (QĐ13), CTV phụ trách khách, CTV chăm sóc (có thời hạn)</td></tr><tr><td>Đồng ý</td><td>5 mục đích, có/không, thời điểm, cách ghi nhận, ngày rút</td></tr><tr><td>Sản phẩm, Bảng giá</td><td>Giá theo <b>phiên bản có ngày hiệu lực</b></td></tr><tr><td>Đơn, Dòng đơn</td><td>Dòng đơn <b>lưu giá tại thời điểm tạo</b>; nguồn; vai đóng góp</td></tr><tr><td>Thanh toán, Giao hàng</td><td>Ngày thu đủ (mốc tính bậc), người xác nhận; serial, ngày giao, kích hoạt</td></tr><tr><td>Phiếu giới thiệu</td><td>QĐ12 a/b, trạng thái, người duyệt, thời gian chăm sóc</td></tr><tr><td>Học, Bài kiểm tra</td><td>Bước học, kết quả, người ghi</td></tr><tr><td>Tham số chính sách</td><td>Mọi tỷ lệ, ngưỡng, có ngày hiệu lực</td></tr><tr><td>Dòng hoa hồng</td><td>Một dòng = một khoản (đơn, vai, căn cứ QĐ, tỷ lệ, số tiền, kỳ); điều chỉnh là <b>dòng âm</b>, không sửa kỳ đã chốt</td></tr><tr><td>Kỳ chi, Phiếu chi</td><td>Tổng theo CTV, thuế (ngưỡng tháng), thực nhận, trạng thái</td></tr><tr><td>Nhật ký sự kiện</td><td>Mọi đổi trạng thái: ai, khi nào, từ → đến</td></tr></table></div>", "xn": 0}, {"id": "s6", "so": "6", "ten": "Bộ máy tính hoa hồng", "ngan": "Bộ máy tính hoa hồng", "html": "<ul><li>Chạy khi có sự kiện <b>Đã thu</b>, <b>Trả lại</b>, <b>Huỷ</b>, và khi chốt kỳ.</li><li>Đọc tham số theo <b>ngày hiệu lực</b> của giao dịch (đổi chính sách không làm sai đơn cũ).</li><li>Tách khối: QĐ09 (bậc, vật tư, Kiosk) · QĐ10 (gói dịch vụ, chăm sóc theo tháng, chuyên môn, Affiliate) · QĐ12 (giới thiệu a/b) · QĐ13 (quản lý, quỹ đồng chia) · thuế.</li><li><b>Bắt buộc qua 12 ca kiểm thử</b> ở mục 14 đặc tả trước khi chạy thật; chạy song song với Cổng CTV và so khớp từng đồng.</li></ul>", "xn": 0}, {"id": "s7", "so": "7", "ten": "Kiến trúc kỹ thuật (đề xuất, đội Dev quyết)", "ngan": "Kiến trúc kỹ thuật", "html": "<ul><li><b>Giao diện:</b> một mã nguồn web, cài được (manifest, service worker); ưu tiên điện thoại; tiếng Việt, phông có dấu chuẩn.</li><li><b>Ngoại tuyến:</b> đọc được danh mục, tài liệu học, link chia sẻ khi mất mạng; <b>không cho tạo đơn ngoại tuyến</b> (tránh trùng, sai giá).</li><li><b>Thông báo:</b> Web Push (Android; iOS từ 16.4 khi đã thêm vào màn hình chính) + email; về sau Zalo OA (ZNS).</li><li><b>Máy chủ:</b> API (REST hoặc tương đương), cơ sở dữ liệu quan hệ, phân quyền theo vai, nhật ký kiểm toán; sao lưu hằng ngày.</li><li><b>Bảo mật:</b> PIN băm, phiên có hạn, giới hạn số lần thử; CTV chỉ đọc khách của mình; xuất dữ liệu cần quyền Admin.</li><li><b>Nơi lưu dữ liệu:</b> <span class=\"xn\">MỞ</span> lưu tại Việt Nam hay không (Luật 91/2025) — chờ Pháp chế.</li></ul>", "xn": 1}, {"id": "s8", "so": "8", "ten": "Tích hợp", "ngan": "Tích hợp", "html": "<div class=\"cuon\"><table><tr><th>Hệ thống</th><th>Hướng</th><th>Dữ liệu</th></tr><tr><td>App FaCare (Luồng 1)</td><td>nhận</td><td>Sự kiện kích hoạt Vali, khách bắt đầu dùng gói (không lấy chỉ số)</td></tr><tr><td>EFCommunity / EF-ID</td><td>hai chiều</td><td>Mã thành viên chung, vai — <span class=\"xn\">MỞ</span> ai giữ danh bạ gốc</td></tr><tr><td>Ngân hàng</td><td>nhận</td><td>Sao kê / webhook chuyển khoản theo mã đơn để đối soát Đã thu</td></tr><tr><td>Kế toán</td><td>xuất</td><td>File chi hoa hồng, thuế khấu trừ theo kỳ</td></tr><tr><td>Email, Zalo OA</td><td>gửi</td><td>Đơn mới, quá 24 giờ, mở bán, duyệt giới thiệu</td></tr><tr><td>Bảng điều hành</td><td>xuất</td><td>Số liệu cho báo cáo</td></tr></table></div>", "xn": 1}, {"id": "s9", "so": "9", "ten": "Chuyển từ Cổng CTV", "ngan": "Chuyển từ Cổng CTV", "html": "<ol><li>Xuất các trang: CTV, Khách hàng, Đơn hàng, Giới thiệu, Affiliate, Đánh giá, Tham số, Sản phẩm.</li><li>Nhập vào hệ thống mới, giữ mã cũ làm bí danh; link cũ <code>?ctv=CTV-0001</code> vẫn chạy.</li><li>Chạy song song tối thiểu 1 kỳ hoa hồng; so khớp số với Cổng CTV.</li><li>Khoá ghi ở Cổng CTV, chuyển trang khách sang hệ thống mới.</li></ol>", "xn": 0}, {"id": "s10", "so": "10", "ten": "Thứ tự phát hành", "ngan": "Thứ tự phát hành", "html": "<div class=\"cuon\"><table><tr><th>Đợt</th><th>Phạm vi</th><th>Xong khi</th></tr><tr><td>1 · Bán được</td><td>A1, A2, A4, A5, A6 cơ bản; trang khách đặt mua; back-office Đã thu, Đã giao, mở bán CTV; hoa hồng QĐ09; thu nhập tạm tính</td><td>CTV thật lên đơn, kế toán xác nhận, hoa hồng khớp ca 1–6, 11</td></tr><tr><td>2 · Chăm sóc</td><td>Gói An tâm gia đình, CTV chăm sóc theo tháng (QĐ10), giới thiệu QĐ12 + báo cáo tháng, việc cần làm, Web Push</td><td>Khớp ca 7, 8, 12</td></tr><tr><td>3 · Chi trả và đội</td><td>Kỳ chi, thuế, xuất file kế toán; Nhóm và QĐ13; chuyển dữ liệu, tắt Cổng CTV</td><td>Khớp ca 9, 10; một kỳ chạy song song khớp số</td></tr><tr><td>4 · Mở rộng</td><td>EF-ID hợp nhất với EFCommunity; Đối tác QĐ11; Zalo OA; đối soát ngân hàng tự động</td><td>Theo từng hạng mục</td></tr></table></div>", "xn": 0}, {"id": "s11", "so": "11", "ten": "Tiêu chí nghiệm thu chung", "ngan": "Tiêu chí nghiệm thu chung", "html": "<ul><li>Qua đủ 12 ca kiểm thử của đặc tả.</li><li>Cài được lên màn hình chính Android và iPhone; mở lần hai dưới 3 giây trên 4G.</li><li>Không có trường dữ liệu sức khỏe trong hệ thống.</li><li>Mọi đổi trạng thái có nhật ký; mọi con số chính sách nằm trong tham số, không viết cứng.</li></ul>", "xn": 0}, {"id": "s12", "so": "12", "ten": "Câu hỏi mở", "ngan": "Câu hỏi mở", "html": "<div class=\"cuon\"><table><tr><th>#</th><th>Câu hỏi</th><th>Ai trả lời</th></tr><tr><td>1</td><td>Mã thành viên dùng chung EF-ID với EFCommunity: hệ nào giữ danh bạ gốc</td><td>anh Linh, FaCare</td></tr><tr><td>2</td><td>Lưu dữ liệu tại Việt Nam</td><td>Pháp chế</td></tr><tr><td>3</td><td>Kênh gửi mã đăng nhập: email, Zalo ZNS hay SMS</td><td>Hai bên</td></tr><tr><td>4</td><td>Tài khoản nhận tiền và pháp nhân xuất hoá đơn</td><td>Kế toán</td></tr><tr><td>5</td><td>8 câu hỏi chính sách còn MỞ ở mục 15 đặc tả</td><td>Ban Giám đốc</td></tr></table></div>", "xn": 0}];
